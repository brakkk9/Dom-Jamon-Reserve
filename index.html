<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Передзамовлення</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: sans-serif; background: #1c1c1e; color: white; height: 100dvh; display: flex; flex-direction: column; }

    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #2c2c2e;
      border-bottom: 1px solid #3a3a3c;
      gap: 10px;
    }

    #toolbar span { font-size: 14px; color: #aaa; flex: 1; }

    #confirm-btn {
      background: #34c759;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #confirm-btn:disabled {
      background: #3a3a3c;
      color: #666;
      cursor: default;
    }

    #skip-btn {
      background: transparent;
      color: #aaa;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <span id="count-label">Нічого не обрано</span>
  <button id="skip-btn" onclick="skipPreorder()">Пропустити</button>
  <button id="confirm-btn" disabled onclick="confirmPreorder()">Підтвердити</button>
</div>

<iframe id="menu-frame" src="https://expz.menu/c2778cba-60f1-42d2-b394-3965c7f561d8" allow="same-origin"></iframe>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let preorder = [];

  const frame = document.getElementById('menu-frame');
  const countLabel = document.getElementById('count-label');
  const confirmBtn = document.getElementById('confirm-btn');

  function updateToolbar() {
    if (preorder.length === 0) {
      countLabel.textContent = 'Нічого не обрано';
      confirmBtn.disabled = true;
    } else {
      countLabel.textContent = `Обрано: ${preorder.length} страв(и)`;
      confirmBtn.disabled = false;
    }
  }

  // Inject JS into iframe once it loads
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument || frame.contentWindow.document;

      // Inject a MutationObserver to rename and intercept bookmark buttons
      const script = doc.createElement('script');
      script.textContent = `
        (function() {
          function patchButtons() {
            // Find all bookmark/закладки buttons — adjust selector based on actual site classes
            const btns = document.querySelectorAll('[class*="bookmark"], [class*="favorite"], [aria-label*="закладк"], button[class*="save"]');
            btns.forEach(btn => {
              if (btn.dataset.patched) return;
              btn.dataset.patched = 'true';

              // Rename label if there's text inside
              btn.querySelectorAll('span, p, div').forEach(el => {
                if (el.innerText && el.innerText.toLowerCase().includes('закладк')) {
                  el.innerText = el.innerText.replace(/закладк\S*/gi, 'Передзамовлення');
                }
              });

              // Override click
              btn.addEventListener('click', (e) => {
                e.stopImmediatePropagation();
                e.preventDefault();

                // Try to get dish name from nearby DOM
                const card = btn.closest('[class*="dish"], [class*="item"], [class*="product"], [class*="card"]');
                const nameEl = card && card.querySelector('[class*="name"], [class*="title"], h2, h3');
                const name = nameEl ? nameEl.innerText.trim() : 'Страва';

                // Post to parent
                window.parent.postMessage({ type: 'preorder_add', name }, '*');
              }, true);
            });
          }

          // Run on load and on DOM changes (SPA)
          patchButtons();
          new MutationObserver(patchButtons).observe(document.body, { childList: true, subtree: true });
        })();
      `;
      doc.body.appendChild(script);
    } catch (e) {
      // Cross-origin block — see note below
      console.warn('Cannot inject into iframe:', e);
    }
  });

  // Listen for messages from iframe
  window.addEventListener('message', (event) => {
    if (event.data?.type === 'preorder_add') {
      const name = event.data.name;
      preorder.push(name);
      updateToolbar();
    }
  });

  function confirmPreorder() {
    tg.sendData(JSON.stringify({ action: 'preorder', items: preorder }));
  }

  function skipPreorder() {
    tg.sendData(JSON.stringify({ action: 'skip' }));
  }
</script>
</body>
</html>
