<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Dom Jamón · Передзамовлення</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink:      #0e0a07;
      --paper:    #f7f2ec;
      --warm:     #e8ddd0;
      --gold:     #c9a96e;
      --gold-dim: #a07840;
      --ember:    #b84a2a;
      --smoke:    #7a6e63;
      --line:     rgba(201,169,110,0.25);
      --serif:    'Cormorant Garamond', Georgia, serif;
      --sans:     'DM Sans', system-ui, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
    .shell { display: flex; flex-direction: column; height: 100dvh; }

    /* TOPBAR */
    .topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 12px; background: var(--ink); gap: 12px; }
    .brand-name { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--gold); letter-spacing: 0.03em; line-height: 1; }
    .brand-sub { font-size: 10px; color: var(--smoke); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 3px; }
    .cart-pill { display: flex; align-items: center; gap: 7px; background: transparent; border: 1.5px solid rgba(201,169,110,.4); color: var(--smoke); border-radius: 100px; padding: 7px 14px; font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .cart-pill.has-items { background: var(--ember); border-color: var(--ember); color: #fff; }
    .cart-pill:active { transform: scale(.95); }

    /* CAT STRIP */
    .cat-strip-wrap { flex-shrink: 0; background: var(--ink); border-bottom: 1px solid rgba(201,169,110,.15); }
    .cat-strip { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 10px; }
    .cat-strip::-webkit-scrollbar { display: none; }
    .cat-tab { flex-shrink: 0; padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--smoke); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; }
    .cat-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* SCROLL */
    .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 110px; }
    .scroll-area::-webkit-scrollbar { width: 3px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--warm); border-radius: 2px; }

    /* ITEM CARD */
    .item-card { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: relative; cursor: pointer; opacity: 0; transform: translateY(6px); animation: fadeUp .3s ease forwards; transition: background .15s; }
    .item-card:active { background: rgba(201,169,110,.06); }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    .item-card.in-cart::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }

    .item-thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--warm); }
    .item-thumb-placeholder { width: 72px; height: 72px; border-radius: 10px; flex-shrink: 0; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 26px; }

    .item-body { flex: 1; min-width: 0; }
    .item-name { font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.2; margin-bottom: 3px; }
    .item-desc { font-size: 11px; color: var(--smoke); margin-bottom: 6px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-footer { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .item-price { font-size: 14px; font-weight: 600; color: var(--gold-dim); }
    .item-tag { font-size: 10px; padding: 2px 8px; border-radius: 100px; border: 1px solid var(--warm); color: var(--smoke); }
    .item-has-options { font-size: 10px; color: var(--gold-dim); margin-left: 2px; }

    /* CONTROLS */
    .item-ctrl { flex-shrink: 0; }
    .add-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--gold); background: transparent; color: var(--gold); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s, transform .1s; }
    .add-btn:active { transform: scale(.85); }
    .add-btn:hover { background: var(--gold); color: var(--ink); }
    .qty-row { display: flex; align-items: center; gap: 5px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--warm); background: transparent; color: var(--ink); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s; }
    .qty-btn:active { transform: scale(.85); }
    .qty-btn.minus { color: var(--smoke); }
    .qty-btn.plus { border-color: var(--gold); color: var(--gold-dim); }
    .qty-num { font-size: 15px; font-weight: 600; min-width: 18px; text-align: center; }

    /* OVERLAY */
    .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(14,10,7,.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* POPUP */
    .popup { width: 100%; background: var(--paper); border-radius: 20px 20px 0 0; overflow: hidden; transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); max-height: 92dvh; display: flex; flex-direction: column; }
    .overlay.open .popup { transform: translateY(0); }

    .popup-img { width: 100%; height: 210px; object-fit: cover; display: block; flex-shrink: 0; }
    .popup-img-placeholder { width: 100%; height: 160px; flex-shrink: 0; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 60px; }

    .popup-body { padding: 20px 20px 4px; flex: 1; overflow-y: auto; }
    .popup-name { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2; margin-bottom: 5px; }
    .popup-price { font-size: 18px; font-weight: 700; color: var(--gold-dim); margin-bottom: 12px; }
    .popup-desc { font-size: 14px; color: var(--smoke); line-height: 1.7; margin-bottom: 14px; }
    .popup-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .popup-tag { font-size: 11px; padding: 4px 12px; border-radius: 100px; border: 1px solid var(--warm); color: var(--smoke); }

    /* OPTIONS */
    .options-section { margin-bottom: 16px; }
    .options-label { font-size: 11px; font-weight: 600; color: var(--smoke); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .options-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .option-chip { padding: 8px 16px; border-radius: 100px; border: 1.5px solid var(--warm); background: transparent; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; transition: all .15s; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .option-chip .opt-price { font-size: 11px; color: var(--smoke); }
    .option-chip.selected { border-color: var(--gold); background: rgba(201,169,110,.12); color: var(--gold-dim); }
    .option-chip.selected .opt-price { color: var(--gold-dim); }

    /* POPUP FOOTER */
    .popup-footer { padding: 14px 20px max(16px, env(safe-area-inset-bottom)); display: flex; gap: 10px; background: var(--paper); border-top: 1px solid var(--line); flex-shrink: 0; }
    .popup-close-btn { padding: 13px 18px; border-radius: 12px; border: 1.5px solid var(--warm); background: transparent; color: var(--smoke); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .popup-add-btn { flex: 1; padding: 13px 16px; border-radius: 12px; border: none; background: var(--ink); color: var(--gold); font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; transition: transform .1s; }
    .popup-add-btn:active { transform: scale(.98); }
    .popup-add-btn:disabled { background: var(--warm); color: var(--smoke); cursor: not-allowed; }
    .popup-qty-row { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .popup-qty-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--warm); background: transparent; color: var(--ink); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s; }
    .popup-qty-btn:active { transform: scale(.85); }
    .popup-qty-btn.minus { color: var(--smoke); }
    .popup-qty-btn.plus { border-color: var(--gold); color: var(--gold-dim); }
    .popup-qty-num { font-size: 20px; font-weight: 700; min-width: 28px; text-align: center; }

    /* BOTTOM BAR */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 16px; background: rgba(247,242,236,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; gap: 10px; }
    .skip-btn { padding: 13px 18px; border-radius: 12px; border: 1.5px solid var(--warm); background: transparent; color: var(--smoke); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .confirm-btn { flex: 1; padding: 13px 16px; border-radius: 12px; border: none; background: var(--ink); color: var(--gold); font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: opacity .2s, transform .1s; }
    .confirm-btn:active { transform: scale(.98); }
    .confirm-btn:disabled { background: var(--warm); color: var(--smoke); cursor: not-allowed; }
    .confirm-btn .sub { font-size: 11px; opacity: .7; font-weight: 400; }

    /* TOAST */
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--gold); padding: 8px 18px; border-radius: 100px; font-size: 12px; font-weight: 500; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; z-index: 200; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <div class="brand-name">Dom Jamón</div>
      <div class="brand-sub">Передзамовлення</div>
    </div>
    <button class="cart-pill" id="cart-pill" onclick="confirmOrder()">
      <span id="pill-label">Кошик порожній</span>
    </button>
  </div>
  <div class="cat-strip-wrap">
    <div class="cat-strip" id="cat-strip"></div>
  </div>
  <div class="scroll-area" id="scroll-area"></div>
</div>

<div class="bottom-bar">
  <button class="skip-btn" onclick="skip()">Пропустити</button>
  <button class="confirm-btn" id="confirm-btn" disabled onclick="confirmOrder()">
    <span>Підтвердити</span>
    <span class="sub" id="confirm-sub"></span>
  </button>
</div>

<!-- POPUP -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="popup" id="popup">
    <div id="popup-img-wrap"></div>
    <div class="popup-body" id="popup-body"></div>
    <div class="popup-footer">
      <button class="popup-close-btn" onclick="closePopup()">Закрити</button>
      <div id="popup-ctrl" style="flex:1;display:flex;align-items:center;justify-content:center"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp || {
    ready: () => {}, expand: () => {},
    sendData: (d) => {
      const p = JSON.parse(d);
      showToast(p.action === 'preorder'
        ? '✓ ' + p.items.map(i => i.name + (i.option ? ' ('+i.option+')' : '') + ' ×' + i.qty).join(', ')
        : 'Крок пропущено');
    }
  };
  tg.ready(); tg.expand();

  // cart[key] = { name, option, price, qty }
  // key = "itemId" or "itemId:optionLabel" for items with options
  const cart = {};
  let popupItemId = null;
  let popupSelectedOption = null; // { label, price }

  // ── LOAD MENU ──────────────────────────────────────────────────────────────
  // In production: fetch('./menu.json').then(r=>r.json()).then(buildUI)
  const MENU = {"categories":[{"id":"wines","name":"Винна карта","emoji":"🍷","items":[{"id":1,"name":"Фрізанте Бьянко Глера","price":120,"desc":"Італія · Глера 100% · 150 мл. Освіжаючий ігристий напій з ніжними бульбашками та квітковими нотами.","tags":["Сухе","Ігристе"],"image":null},{"id":2,"name":"Pinot Noir 46 Parallel","price":135,"desc":"Делікатний, свіжий, чистий · 150 мл. Легке червоне вино з нотами стиглих ягід.","tags":["Сухе","Україна"],"image":null},{"id":3,"name":"Sauvignon Blanc Marlborough","price":145,"desc":"Нова Зеландія · яскравий · 150 мл. Крутий Sauvignon Blanc з цитрусовими та трав'яними нотами.","tags":["Сухе","По бокалу"],"image":null},{"id":4,"name":"Rioja Reserva","price":210,"desc":"Іспанія · Tempranillo · 150 мл. Витримане червоне вино з дубовими нотами та ягідним ароматом.","tags":["Сухе","Червоне"],"image":null}]},{"id":"cocktails","name":"Коктейлі","emoji":"🍹","items":[{"id":10,"name":"Aperol Spritz","price":180,"desc":"Aperol, Prosecco, содова, апельсин. Класичний італійський аперитив з гірко-солодким смаком.","tags":["Алко"],"image":null},{"id":11,"name":"Mojito","price":160,"desc":"Ром, м'ята, лайм, цукор, содова. Освіжаючий кубинський коктейль.","tags":["Алко"],"image":null},{"id":12,"name":"Sangria Blanca","price":170,"desc":"Біле вино, фрукти, лимон · 300 мл. Фірмовий рецепт.","tags":["Алко","Фірмовий"],"image":null}]},{"id":"tapas","name":"Тапас","emoji":"🫙","items":[{"id":20,"name":"Хамон Іберіко","price":320,"desc":"Витриманий іспанський хамон зі свиней породи іберіко, 80 г. Характерний горіховий смак і насичений аромат від тривалої сухої витримки.","tags":["М'ясне"],"image":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Jam%C3%B3n_iberico.jpg/1280px-Jam%C3%B3n_iberico.jpg"},{"id":21,"name":"Чоризо на грилі","price":195,"desc":"Гостра іспанська ковбаса з паприкою та часником, 100 г.","tags":["М'ясне","Гостре"],"image":null},{"id":22,"name":"Патас Бравас","price":150,"desc":"Хрустка смажена картопля з фірмовим гострим соусом браваc.","tags":["Вегетаріанське"],"image":null},{"id":23,"name":"Брускета з томатами","price":120,"desc":"Підсмажений хліб з натертим томатом, часником та оливковою олією.","tags":["Вегетаріанське"],"image":null}]},{"id":"cheese","name":"Сири","emoji":"🧀","items":[{"id":30,"name":"Манчего 6 місяців","price":210,"desc":"Іспанський овечий сир витримки 6 місяців, 80 г.","tags":["Сир"],"image":null},{"id":31,"name":"Сирна тарілка","price":380,"desc":"Асорті 4 іспанських сирів з медом, волоськими горіхами та виноградом.","tags":["Сир","Шеф рекомендує"],"image":null}]},{"id":"drinks","name":"Напої","emoji":"🥤","items":[{"id":40,"name":"Вода мінеральна","price":60,"desc":"Негазована або газована мінеральна вода.","tags":[],"image":null,"options":{"label":"Об'єм","choices":[{"label":"0.5 л","price":60},{"label":"1 л","price":90},{"label":"1.5 л","price":120}]}},{"id":41,"name":"Свіжий сік","price":120,"desc":"Свіжовичавлений сік на ваш вибір.","tags":["Без алко"],"image":null,"options":{"label":"Смак","choices":[{"label":"Апельсин","price":120},{"label":"Яблуко","price":110},{"label":"Морква","price":100}]}},{"id":42,"name":"Лимонад","price":130,"desc":"Домашній лимонад із сезонними фруктами · 400 мл.","tags":["Без алко"],"image":null,"options":{"label":"Розмір","choices":[{"label":"400 мл","price":130},{"label":"700 мл","price":200},{"label":"1.5 л","price":350}]}}]},{"id":"desserts","name":"Десерти","emoji":"🍮","items":[{"id":50,"name":"Крем Каталана","price":145,"desc":"Класичний каталонський десерт — ніжний крем з карамельною скоринкою.","tags":["Десерт","Шеф рекомендує"],"image":null},{"id":51,"name":"Куля морозива","price":55,"desc":"Домашнє морозиво на ваш вибір.","tags":["Десерт"],"image":null,"options":{"label":"Смак","choices":[{"label":"Ваніль","price":55},{"label":"Шоколад","price":55},{"label":"Полуниця","price":60}]}}]}]};

  buildUI(MENU);
  updateBar();

  // ── BUILD UI ───────────────────────────────────────────────────────────────
  function buildUI(data) {
    const area = document.getElementById('scroll-area');
    const strip = document.getElementById('cat-strip');
    area.innerHTML = ''; strip.innerHTML = '';

    data.categories.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'cat-tab' + (ci === 0 ? ' active' : '');
      tab.textContent = cat.emoji + ' ' + cat.name;
      tab.dataset.id = cat.id;
      tab.onclick = () => switchCategory(cat.id);
      strip.appendChild(tab);

      const blk = document.createElement('div');
      blk.id = 'blk-' + cat.id;
      blk.style.display = ci === 0 ? 'block' : 'none';

      cat.items.forEach((item, ii) => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.id = 'card-' + item.id;
        card.style.animationDelay = ii * 40 + 'ms';

        const thumbHTML = item.image
          ? `<img class="item-thumb" src="${item.image}" alt="${item.name}" loading="lazy"/>`
          : `<div class="item-thumb-placeholder">${cat.emoji}</div>`;

        const fromPrice = item.options
          ? Math.min(...item.options.choices.map(c => c.price))
          : item.price;
        const priceLabel = item.options ? 'від ' + fromPrice + ' ₴' : item.price + ' ₴';
        const optHint = item.options ? `<span class="item-has-options">· ${item.options.label}</span>` : '';

        card.innerHTML = `
          ${thumbHTML}
          <div class="item-body">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-footer">
              <span class="item-price">${priceLabel}</span>
              ${optHint}
              ${item.tags.map(t => `<span class="item-tag">${t}</span>`).join('')}
            </div>
          </div>
          <div class="item-ctrl" id="ctrl-${item.id}">
            <button class="add-btn" onclick="event.stopPropagation();handleAdd(${item.id})">+</button>
          </div>`;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.item-ctrl')) return;
          openPopup(item.id, cat.emoji);
        });
        blk.appendChild(card);
      });
      area.appendChild(blk);
    });
  }

  // ── CATEGORY SWITCH ────────────────────────────────────────────────────────
  function switchCategory(id) {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
    document.querySelectorAll('[id^=blk-]').forEach(blk => {
      const visible = blk.id === 'blk-' + id;
      blk.style.display = visible ? 'block' : 'none';
      if (visible) blk.querySelectorAll('.item-card').forEach((c, i) => {
        c.style.animation = 'none'; c.offsetHeight;
        c.style.animation = ''; c.style.animationDelay = i * 40 + 'ms';
      });
    });
    document.getElementById('scroll-area').scrollTop = 0;
    document.querySelector('.cat-tab.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  // ── POPUP ──────────────────────────────────────────────────────────────────
  function openPopup(id, catEmoji) {
    const item = findItem(id);
    if (!item) return;
    popupItemId = id;
    popupSelectedOption = item.options ? item.options.choices[0] : null;

    // Image
    document.getElementById('popup-img-wrap').innerHTML = item.image
      ? `<img class="popup-img" src="${item.image}" alt="${item.name}"/>`
      : `<div class="popup-img-placeholder">${catEmoji}</div>`;

    // Body
    const optionsHTML = item.options ? `
      <div class="options-section">
        <div class="options-label">${item.options.label}</div>
        <div class="options-grid" id="options-grid">
          ${item.options.choices.map((c, i) => `
            <button class="option-chip ${i === 0 ? 'selected' : ''}"
              onclick="selectOption(${id}, ${i})"
              id="opt-${id}-${i}">
              ${c.label}
              <span class="opt-price">${c.price} ₴</span>
            </button>`).join('')}
        </div>
      </div>` : '';

    document.getElementById('popup-body').innerHTML = `
      <div class="popup-name">${item.name}</div>
      <div class="popup-price" id="popup-price">${popupSelectedOption ? popupSelectedOption.price : item.price} ₴</div>
      <div class="popup-desc">${item.desc}</div>
      ${optionsHTML}
      <div class="popup-tags">${item.tags.map(t => `<span class="popup-tag">${t}</span>`).join('')}</div>`;

    renderPopupCtrl();
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function selectOption(itemId, idx) {
    const item = findItem(itemId);
    popupSelectedOption = item.options.choices[idx];
    // Update chips
    item.options.choices.forEach((_, i) => {
      document.getElementById(`opt-${itemId}-${i}`)?.classList.toggle('selected', i === idx);
    });
    // Update price display
    document.getElementById('popup-price').textContent = popupSelectedOption.price + ' ₴';
    renderPopupCtrl();
  }

  function renderPopupCtrl() {
    const item = findItem(popupItemId);
    const ctrl = document.getElementById('popup-ctrl');
    const key  = cartKey(popupItemId, popupSelectedOption);
    const qty  = cart[key]?.qty || 0;
    const needsOption = item.options && !popupSelectedOption;

    if (qty === 0) {
      ctrl.innerHTML = `<button class="popup-add-btn" ${needsOption ? 'disabled' : ''}
        onclick="popupAdd()">Додати до замовлення</button>`;
    } else {
      ctrl.innerHTML = `
        <div class="popup-qty-row">
          <button class="popup-qty-btn minus" onclick="popupRemove()">−</button>
          <span class="popup-qty-num">${qty}</span>
          <button class="popup-qty-btn plus" onclick="popupAdd()">+</button>
        </div>`;
    }
  }

  function popupAdd() {
    const item = findItem(popupItemId);
    const opt  = popupSelectedOption;
    const key  = cartKey(popupItemId, opt);
    const price = opt ? opt.price : item.price;
    const label = opt ? `${item.name} (${opt.label})` : item.name;
    if (!cart[key]) cart[key] = { name: item.name, option: opt?.label || null, price, qty: 0 };
    cart[key].qty++;
    renderPopupCtrl();
    renderCardCtrl(popupItemId);
    updateBar();
  }

  function popupRemove() {
    const key = cartKey(popupItemId, popupSelectedOption);
    if (!cart[key]) return;
    cart[key].qty = Math.max(0, cart[key].qty - 1);
    if (cart[key].qty === 0) delete cart[key];
    renderPopupCtrl();
    renderCardCtrl(popupItemId);
    updateBar();
  }

  function overlayClick(e) { if (e.target === document.getElementById('overlay')) closePopup(); }
  function closePopup() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
    popupItemId = null;
    popupSelectedOption = null;
  }

  // ── CARD CTRL ──────────────────────────────────────────────────────────────
  // For items with options: show total qty across all options; click opens popup
  // For items without options: standard +/- inline
  function handleAdd(id) {
    const item = findItem(id);
    if (item.options) {
      openPopup(id, getCatEmoji(id));
    } else {
      addSimple(id);
    }
  }

  function addSimple(id) {
    const item = findItem(id);
    const key = String(id);
    if (!cart[key]) cart[key] = { name: item.name, option: null, price: item.price, qty: 0 };
    cart[key].qty++;
    renderCardCtrl(id);
    updateBar();
  }

  function removeSimple(id) {
    const key = String(id);
    if (!cart[key]) return;
    cart[key].qty = Math.max(0, cart[key].qty - 1);
    if (cart[key].qty === 0) delete cart[key];
    renderCardCtrl(id);
    updateBar();
  }

  function renderCardCtrl(id) {
    const ctrl = document.getElementById('ctrl-' + id);
    const card = document.getElementById('card-' + id);
    if (!ctrl) return;
    const item = findItem(id);

    // total qty for this item (sum across all options)
    const totalQty = Object.entries(cart)
      .filter(([k]) => k === String(id) || k.startsWith(id + ':'))
      .reduce((s, [, v]) => s + v.qty, 0);

    card.classList.toggle('in-cart', totalQty > 0);

    if (item.options) {
      // always show + (opens popup), but show count if any
      if (totalQty === 0) {
        ctrl.innerHTML = `<button class="add-btn" onclick="event.stopPropagation();openPopup(${id},'${getCatEmoji(id)}')">+</button>`;
      } else {
        ctrl.innerHTML = `
          <div class="qty-row">
            <button class="qty-btn plus" style="width:auto;padding:0 10px;border-radius:100px;font-size:12px;font-weight:600;"
              onclick="event.stopPropagation();openPopup(${id},'${getCatEmoji(id)}')">
              ${totalQty} · змінити
            </button>
          </div>`;
      }
    } else {
      if (totalQty === 0) {
        ctrl.innerHTML = `<button class="add-btn" onclick="event.stopPropagation();addSimple(${id})">+</button>`;
      } else {
        ctrl.innerHTML = `
          <div class="qty-row">
            <button class="qty-btn minus" onclick="event.stopPropagation();removeSimple(${id})">−</button>
            <span class="qty-num">${totalQty}</span>
            <button class="qty-btn plus" onclick="event.stopPropagation();addSimple(${id})">+</button>
          </div>`;
      }
    }
  }

  // ── BAR ────────────────────────────────────────────────────────────────────
  function updateBar() {
    const vals  = Object.values(cart);
    const count = vals.reduce((s, i) => s + i.qty, 0);
    const total = vals.reduce((s, i) => s + i.qty * i.price, 0);
    document.getElementById('cart-pill').classList.toggle('has-items', count > 0);
    document.getElementById('pill-label').textContent =
      count > 0 ? count + ' ' + plural(count, 'позиція', 'позиції', 'позицій') : 'Кошик порожній';
    document.getElementById('confirm-btn').disabled = count === 0;
    document.getElementById('confirm-sub').textContent = count > 0 ? 'Разом: ' + total + ' ₴' : '';
  }

  // ── SEND ───────────────────────────────────────────────────────────────────
  function confirmOrder() {
    const vals = Object.values(cart).filter(i => i.qty > 0);
    if (!vals.length) return;
    tg.sendData(JSON.stringify({
      action: 'preorder',
      items: vals.map(i => ({ name: i.name, option: i.option, qty: i.qty, price: i.price })),
      total: vals.reduce((s, i) => s + i.qty * i.price, 0)
    }));
  }

  function skip() { tg.sendData(JSON.stringify({ action: 'skip' })); }

  // ── UTILS ──────────────────────────────────────────────────────────────────
  function cartKey(id, opt) { return opt ? `${id}:${opt.label}` : String(id); }

  function findItem(id) {
    for (const cat of MENU.categories)
      for (const item of cat.items)
        if (item.id === id) return item;
    return null;
  }

  function getCatEmoji(itemId) {
    for (const cat of MENU.categories)
      if (cat.items.find(i => i.id === itemId)) return cat.emoji;
    return '🍽️';
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if ([2,3,4].includes(m10) && ![12,13,14].includes(m100)) return few;
    return many;
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
  }
</script>
</body>
</html>
