<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dom Jamon · Передзамовлення</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <style>
/* ============================================================
   Dom Jamon — Preorder WebApp
   ============================================================ */

:root {
  --ink:       #0e0a07;
  --paper:     #f7f2ec;
  --warm:      #e8ddd0;
  --gold:      #c9a96e;
  --gold-dim:  #a07840;
  --ember:     #b84a2a;
  --smoke:     #7a6e63;
  --line:      rgba(201, 169, 110, 0.25);
  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'DM Sans', system-ui, sans-serif;
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  width: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
}

/* ── Layout ─────────────────────────────────────────── */

.shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Topbar ─────────────────────────────────────────── */

.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 12px;
  background: var(--ink);
  gap: 12px;
}

.brand-name {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.03em;
  line-height: 1;
}

.brand-sub {
  font-size: 10px;
  color: var(--smoke);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 3px;
}

.cart-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1.5px solid rgba(201, 169, 110, 0.4);
  color: var(--smoke);
  border-radius: 100px;
  padding: 7px 14px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.cart-pill.has-items {
  background: var(--ember);
  border-color: var(--ember);
  color: #fff;
}

.cart-pill:active {
  transform: scale(0.95);
}

/* ── Category strip ──────────────────────────────────── */

.cat-strip-wrap {
  flex-shrink: 0;
  background: var(--ink);
  border-bottom: 1px solid rgba(201, 169, 110, 0.15);
}

.cat-strip {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 10px;
}

.cat-strip::-webkit-scrollbar {
  display: none;
}

.cat-tab {
  flex-shrink: 0;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--smoke);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}

.cat-tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* ── Scroll area ─────────────────────────────────────── */

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 110px;
}

.scroll-area::-webkit-scrollbar {
  width: 3px;
}

.scroll-area::-webkit-scrollbar-thumb {
  background: var(--warm);
  border-radius: 2px;
}

/* ── Item card ───────────────────────────────────────── */

.item-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  position: relative;
  cursor: pointer;
  opacity: 0;
  transform: translateY(6px);
  animation: fadeUp 0.3s ease forwards;
  transition: background 0.15s;
}

.item-card:active {
  background: rgba(201, 169, 110, 0.06);
}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: none;
  }
}

.item-card.in-cart::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--gold);
}

.item-thumb {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--warm);
}

.item-thumb-placeholder {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  flex-shrink: 0;
  background: var(--warm);
}

.item-body {
  flex: 1;
  min-width: 0;
}

.item-name {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  margin-bottom: 3px;
}

.item-desc {
  font-size: 11px;
  color: var(--smoke);
  margin-bottom: 6px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.item-footer {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.item-price {
  font-size: 14px;
  font-weight: 600;
  color: var(--gold-dim);
}

.item-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 100px;
  border: 1px solid var(--warm);
  color: var(--smoke);
}

.item-has-options {
  font-size: 10px;
  color: var(--gold-dim);
}

/* ── Item controls ───────────────────────────────────── */

.item-ctrl {
  flex-shrink: 0;
}

.add-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1.5px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, transform 0.1s;
}

.add-btn:active,
.add-btn:hover {
  background: var(--gold);
  color: var(--ink);
}

.qty-row {
  display: flex;
  align-items: center;
  gap: 5px;
}

.qty-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--warm);
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}

.qty-btn:active {
  transform: scale(0.85);
}

.qty-btn.minus {
  color: var(--smoke);
}

.qty-btn.plus {
  border-color: var(--gold);
  color: var(--gold-dim);
}

.qty-num {
  font-size: 15px;
  font-weight: 600;
  min-width: 18px;
  text-align: center;
}

/* ── Shared overlay ──────────────────────────────────── */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(14, 10, 7, 0.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.overlay.open {
  opacity: 1;
  pointer-events: all;
}

/* ── Sheet base (shared by popup + drawer) ───────────── */

.sheet {
  width: 100%;
  background: var(--paper);
  border-radius: 20px 20px 0 0;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
}

.overlay.open .sheet {
  transform: translateY(0);
}

/* ── Item popup ──────────────────────────────────────── */

.popup-img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
  flex-shrink: 0;
  border-radius: 20px 20px 0 0;
}

.popup-img-placeholder {
  width: 100%;
  height: 140px;
  flex-shrink: 0;
  background: var(--warm);
  border-radius: 20px 20px 0 0;
}

.popup-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 4px;
}

.popup-scroll::-webkit-scrollbar {
  width: 3px;
}

.popup-scroll::-webkit-scrollbar-thumb {
  background: var(--warm);
  border-radius: 2px;
}

.popup-name {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  line-height: 1.2;
  margin-bottom: 4px;
}

.popup-price {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-dim);
  margin-bottom: 12px;
}

.popup-desc {
  font-size: 14px;
  color: var(--smoke);
  line-height: 1.7;
  margin-bottom: 14px;
}

.popup-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 16px;
}

.popup-tag {
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 100px;
  border: 1px solid var(--warm);
  color: var(--smoke);
}

/* ── Options ─────────────────────────────────────────── */

.options-section {
  margin-bottom: 16px;
}

.options-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--smoke);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

.options-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.option-chip {
  padding: 8px 16px;
  border-radius: 100px;
  border: 1.5px solid var(--warm);
  background: transparent;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.option-chip .opt-price {
  font-size: 11px;
  color: var(--smoke);
}

.option-chip.selected {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.12);
  color: var(--gold-dim);
}

.option-chip.selected .opt-price {
  color: var(--gold-dim);
}

/* ── Sheet footer (shared) ───────────────────────────── */

.sheet-footer {
  padding: 14px 20px max(16px, env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
  background: var(--paper);
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}

.btn-secondary {
  padding: 13px 18px;
  border-radius: 12px;
  border: 1.5px solid var(--warm);
  background: transparent;
  color: var(--smoke);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.15s, color 0.15s;
}

.btn-secondary:hover {
  border-color: var(--smoke);
  color: var(--ink);
}

.btn-primary {
  flex: 1;
  padding: 13px 16px;
  border-radius: 12px;
  border: none;
  background: var(--ink);
  color: var(--gold);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.2s;
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-primary:disabled {
  background: var(--warm);
  color: var(--smoke);
  cursor: not-allowed;
}

.btn-primary .sub {
  font-size: 11px;
  opacity: 0.7;
  font-weight: 400;
}

/* popup-specific ctrl area */
.popup-ctrl-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.popup-qty-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex: 1;
}

.popup-qty-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--warm);
  background: transparent;
  color: var(--ink);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}

.popup-qty-btn:active {
  transform: scale(0.85);
}

.popup-qty-btn.minus {
  color: var(--smoke);
}

.popup-qty-btn.plus {
  border-color: var(--gold);
  color: var(--gold-dim);
}

.popup-qty-num {
  font-size: 20px;
  font-weight: 700;
  min-width: 28px;
  text-align: center;
}

/* ── Cart drawer ─────────────────────────────────────── */

.drawer-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.drawer-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  font-style: italic;
}

.drawer-total {
  font-size: 16px;
  font-weight: 700;
  color: var(--gold-dim);
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
}

.drawer-body::-webkit-scrollbar {
  width: 3px;
}

.drawer-body::-webkit-scrollbar-thumb {
  background: var(--warm);
  border-radius: 2px;
}

.cart-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  gap: 8px;
  color: var(--smoke);
  font-size: 14px;
}

.cart-line {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 20px;
  border-bottom: 1px solid var(--line);
}

.cart-line-info {
  flex: 1;
  min-width: 0;
}

.cart-line-name {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
}

.cart-line-option {
  font-size: 11px;
  color: var(--smoke);
  margin-top: 2px;
}

.cart-line-price {
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-dim);
  margin-top: 4px;
}

.cart-line-price .unit {
  font-size: 11px;
  font-weight: 400;
  color: var(--smoke);
}

.cart-line-ctrl {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.cart-qty-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--warm);
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}

.cart-qty-btn:active {
  transform: scale(0.85);
}

.cart-qty-btn.minus {
  color: var(--smoke);
}

.cart-qty-btn.plus {
  border-color: var(--gold);
  color: var(--gold-dim);
}

.cart-qty-num {
  font-size: 14px;
  font-weight: 700;
  min-width: 20px;
  text-align: center;
}

/* ── Bottom bar ──────────────────────────────────────── */

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px max(16px, env(safe-area-inset-bottom));
  background: rgba(247, 242, 236, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
}
  </style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div>
      <div class="brand-name">Dom Jamon</div>
      <div class="brand-sub">Передзамовлення</div>
    </div>
    <button class="cart-pill" id="cart-pill" onclick="openCartDrawer()">
      <span id="pill-label">Кошик порожній</span>
    </button>
  </div>
  <div class="cat-strip-wrap">
    <div class="cat-strip" id="cat-strip"></div>
  </div>
  <div class="scroll-area" id="scroll-area"></div>
</div>

<div class="bottom-bar">
  <button class="btn-secondary" onclick="skip()">Пропустити</button>
  <button class="btn-primary" id="confirm-btn" disabled onclick="confirmOrder()">
    <span>Підтвердити</span>
    <span class="sub" id="confirm-sub"></span>
  </button>
</div>

<div class="overlay" id="item-overlay" onclick="handleOverlayClick(event, 'item-overlay')">
  <div class="sheet">
    <div id="popup-img-wrap"></div>
    <div class="popup-scroll" id="popup-body"></div>
    <div class="sheet-footer">
      <button class="btn-secondary" onclick="closeItemPopup()">Закрити</button>
      <div class="popup-ctrl-wrap" id="popup-ctrl"></div>
    </div>
  </div>
</div>

<div class="overlay" id="cart-overlay" onclick="handleOverlayClick(event, 'cart-overlay')">
  <div class="sheet">
    <div class="drawer-header">
      <span class="drawer-title">Ваше замовлення</span>
      <span class="drawer-total" id="drawer-total"></span>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="sheet-footer">
      <button class="btn-secondary" onclick="closeCartDrawer()">Продовжити вибір</button>
      <button class="btn-primary" id="drawer-confirm-btn" disabled onclick="confirmOrder()">
        <span>Підтвердити</span>
        <span class="sub" id="drawer-confirm-sub"></span>
      </button>
    </div>
  </div>
</div>

          "options": {

            "choices": [

    {

      "items": [
        { "id": 50, "name": "Крем Каталана", "price": 145, "desc": "Класичний каталонський десерт — ніжний крем з карамельною скоринкою.", "tags": ["Десерт", "Від шефа"], "image": null },
        {
          "id": 51, "name": "Куля морозива", "price": 55,
          "desc": "Домашнє морозиво на ваш вибір.",
          "tags": ["Десерт"], "image": null,
          "options": {
            "label": "Смак",
            "choices": [
              { "label": "Ваніль",   "price": 55 },
              { "label": "Шоколад",  "price": 55 },
              { "label": "Полуниця", "price": 60 }
            ]
          }
        }
      ]
    }
  ]
};
</script>
<script>
/* ============================================================
   Dom Jamon — Preorder WebApp  ·  app.js
   ============================================================ */

// ---------------------------------------------------------------------------
// Telegram WebApp — with browser preview fallback
// ---------------------------------------------------------------------------

const tg = window.Telegram?.WebApp ?? {
  ready:    () => {},
  expand:   () => {},
  sendData: (data) => console.log('[tg.sendData]', JSON.parse(data)),
  close:    () => {
    // Preview fallback: show a full-screen confirmation instead of closing
    document.body.innerHTML = `
      <div style="
        height:100dvh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:16px;
        background:#0e0a07; color:#c9a96e;
        font-family:'DM Sans',sans-serif; text-align:center; padding:32px;
      ">
        <div style="font-family:'Cormorant Garamond',serif; font-size:28px; font-style:italic;">
          Дякуємо!
        </div>
        <div style="font-size:14px; color:#7a6e63; line-height:1.6;">
          У реальному Telegram WebApp<br>застосунок закривається тут<br>і бот продовжує розмову.
        </div>
      </div>`;
  },
};

tg.ready();
tg.expand();

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const STORAGE_KEY = 'domjamon_cart_v1';

// key = "<itemId>" for plain items, "<itemId>:<optionLabel>" for options
// value = { name, option, price, qty, itemId }
const cart = {};

let popupItemId         = null;
let popupSelectedOption = null;

// ---------------------------------------------------------------------------
// Persistence
// ---------------------------------------------------------------------------

function saveCart() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); } catch (_) {}
}

function loadCart() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) Object.assign(cart, JSON.parse(raw));
  } catch (_) {}
}

// ---------------------------------------------------------------------------
// Build UI
// ---------------------------------------------------------------------------

function buildUI(data) {
  const area  = document.getElementById('scroll-area');
  const strip = document.getElementById('cat-strip');
  area.innerHTML  = '';
  strip.innerHTML = '';

  data.categories.forEach((cat, ci) => {

    // Tab
    const tab       = document.createElement('div');
    tab.className   = 'cat-tab' + (ci === 0 ? ' active' : '');
    tab.textContent = cat.name;
    tab.dataset.id  = cat.id;
    tab.onclick     = () => switchCategory(cat.id);
    strip.appendChild(tab);

    // Block
    const blk         = document.createElement('div');
    blk.id            = 'blk-' + cat.id;
    blk.style.display = ci === 0 ? 'block' : 'none';

    cat.items.forEach((item, ii) => {
      const card              = document.createElement('div');
      card.className          = 'item-card';
      card.id                 = 'card-' + item.id;
      card.style.animationDelay = (ii * 40) + 'ms';

      const thumbHTML = item.image
        ? `<img class="item-thumb" src="${item.image}" alt="${item.name}" loading="lazy">`
        : `<div class="item-thumb-placeholder"></div>`;

      const fromPrice  = item.options
        ? Math.min(...item.options.choices.map(c => c.price))
        : item.price;
      const priceLabel = item.options ? 'від ' + fromPrice + ' ₴' : item.price + ' ₴';
      const optHint    = item.options
        ? `<span class="item-has-options">· ${item.options.label}</span>`
        : '';

      card.innerHTML = `
        ${thumbHTML}
        <div class="item-body">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          <div class="item-footer">
            <span class="item-price">${priceLabel}</span>
            ${optHint}
            ${item.tags.map(t => `<span class="item-tag">${t}</span>`).join('')}
          </div>
        </div>
        <div class="item-ctrl" id="ctrl-${item.id}">
          <button class="add-btn"
            onclick="event.stopPropagation(); handleAdd(${item.id})">+</button>
        </div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.closest('.item-ctrl')) return;
        openItemPopup(item.id);
      });

      blk.appendChild(card);
    });

    area.appendChild(blk);
  });
}

// ---------------------------------------------------------------------------
// Category switching
// ---------------------------------------------------------------------------

function switchCategory(id) {
  document.querySelectorAll('.cat-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.id === id),
  );

  document.querySelectorAll('[id^=blk-]').forEach(blk => {
    const visible = blk.id === 'blk-' + id;
    blk.style.display = visible ? 'block' : 'none';
    if (visible) {
      blk.querySelectorAll('.item-card').forEach((card, i) => {
        card.style.animation      = 'none';
        card.offsetHeight;                      // force reflow
        card.style.animation      = '';
        card.style.animationDelay = (i * 40) + 'ms';
      });
    }
  });

  document.getElementById('scroll-area').scrollTop = 0;
  document.querySelector('.cat-tab.active')
    ?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ---------------------------------------------------------------------------
// Item popup
// ---------------------------------------------------------------------------

function openItemPopup(id) {
  const item = findItem(id);
  if (!item) return;

  popupItemId         = id;
  popupSelectedOption = item.options ? item.options.choices[0] : null;

  document.getElementById('popup-img-wrap').innerHTML = item.image
    ? `<img class="popup-img" src="${item.image}" alt="${item.name}">`
    : `<div class="popup-img-placeholder"></div>`;

  const optionsHTML = item.options ? `
    <div class="options-section">
      <div class="options-label">${item.options.label}</div>
      <div class="options-grid">
        ${item.options.choices.map((c, i) => `
          <button
            class="option-chip ${i === 0 ? 'selected' : ''}"
            id="opt-${id}-${i}"
            onclick="selectOption(${id}, ${i})"
          >${c.label}<span class="opt-price">${c.price} ₴</span></button>
        `).join('')}
      </div>
    </div>
  ` : '';

  document.getElementById('popup-body').innerHTML = `
    <div class="popup-name">${item.name}</div>
    <div class="popup-price" id="popup-price">
      ${(popupSelectedOption?.price ?? item.price)} ₴
    </div>
    <div class="popup-desc">${item.desc}</div>
    ${optionsHTML}
    <div class="popup-tags">
      ${item.tags.map(t => `<span class="popup-tag">${t}</span>`).join('')}
    </div>
  `;

  renderPopupCtrl();
  openOverlay('item-overlay');
}

function selectOption(itemId, idx) {
  const item          = findItem(itemId);
  popupSelectedOption = item.options.choices[idx];

  item.options.choices.forEach((_, i) =>
    document.getElementById(`opt-${itemId}-${i}`)
      ?.classList.toggle('selected', i === idx),
  );

  document.getElementById('popup-price').textContent =
    popupSelectedOption.price + ' ₴';

  renderPopupCtrl();
}

function renderPopupCtrl() {
  const ctrl = document.getElementById('popup-ctrl');
  const key  = cartKey(popupItemId, popupSelectedOption);
  const qty  = cart[key]?.qty ?? 0;

  if (qty === 0) {
    ctrl.innerHTML = `
      <button class="btn-primary" style="flex:1" onclick="popupAdd()">
        Додати до замовлення
      </button>`;
  } else {
    ctrl.innerHTML = `
      <div class="popup-qty-row">
        <button class="popup-qty-btn minus" onclick="popupRemove()">−</button>
        <span class="popup-qty-num">${qty}</span>
        <button class="popup-qty-btn plus"  onclick="popupAdd()">+</button>
      </div>`;
  }
}

function popupAdd() {
  const item  = findItem(popupItemId);
  const opt   = popupSelectedOption;
  const key   = cartKey(popupItemId, opt);
  const price = opt ? opt.price : item.price;

  if (!cart[key]) {
    cart[key] = {
      name:   item.name,
      option: opt?.label ?? null,
      price,
      qty:    0,
      itemId: popupItemId,
    };
  }

  cart[key].qty++;
  saveCart();
  renderPopupCtrl();
  renderCardCtrl(popupItemId);
  updateBar();
}

function popupRemove() {
  const key = cartKey(popupItemId, popupSelectedOption);
  if (!cart[key]) return;

  cart[key].qty = Math.max(0, cart[key].qty - 1);
  if (cart[key].qty === 0) delete cart[key];

  saveCart();
  renderPopupCtrl();
  renderCardCtrl(popupItemId);
  updateBar();
}

// ---------------------------------------------------------------------------
// Cart drawer
// ---------------------------------------------------------------------------

function openCartDrawer() {
  renderCartDrawer();
  openOverlay('cart-overlay');
}

function renderCartDrawer() {
  const body       = document.getElementById('drawer-body');
  const totalEl    = document.getElementById('drawer-total');
  const confirmBtn = document.getElementById('drawer-confirm-btn');
  const confirmSub = document.getElementById('drawer-confirm-sub');

  const entries    = Object.entries(cart).filter(([, v]) => v.qty > 0);
  const grandTotal = entries.reduce((s, [, v]) => s + v.qty * v.price, 0);
  const count      = entries.reduce((s, [, v]) => s + v.qty, 0);

  totalEl.textContent    = grandTotal > 0 ? grandTotal + ' ₴' : '';
  confirmBtn.disabled    = count === 0;
  confirmSub.textContent = count > 0 ? 'Разом: ' + grandTotal + ' ₴' : '';

  if (entries.length === 0) {
    body.innerHTML = `<div class="cart-empty">Кошик порожній</div>`;
    return;
  }

  body.innerHTML = entries.map(([key, v]) => `
    <div class="cart-line">
      <div class="cart-line-info">
        <div class="cart-line-name">${v.name}</div>
        ${v.option ? `<div class="cart-line-option">${v.option}</div>` : ''}
        <div class="cart-line-price">
          ${v.price * v.qty} ₴
          <span class="unit">${v.price} ₴ × ${v.qty}</span>
        </div>
      </div>
      <div class="cart-line-ctrl">
        <button class="cart-qty-btn minus"
          onclick="cartChangeQty('${key}', -1)">−</button>
        <span class="cart-qty-num">${v.qty}</span>
        <button class="cart-qty-btn plus"
          onclick="cartChangeQty('${key}', +1)">+</button>
      </div>
    </div>
  `).join('');
}

function cartChangeQty(key, delta) {
  if (!cart[key]) return;

  const itemId = cart[key].itemId ?? parseInt(key.split(':')[0], 10);
  cart[key].qty = Math.max(0, cart[key].qty + delta);
  if (cart[key].qty === 0) delete cart[key];

  saveCart();
  renderCardCtrl(itemId);
  updateBar();
  renderCartDrawer();
}

// ---------------------------------------------------------------------------
// Card controls
// ---------------------------------------------------------------------------

function handleAdd(id) {
  findItem(id).options ? openItemPopup(id) : addSimple(id);
}

function addSimple(id) {
  const item = findItem(id);
  const key  = String(id);
  if (!cart[key]) {
    cart[key] = { name: item.name, option: null, price: item.price, qty: 0, itemId: id };
  }
  cart[key].qty++;
  saveCart();
  renderCardCtrl(id);
  updateBar();
}

function removeSimple(id) {
  const key = String(id);
  if (!cart[key]) return;
  cart[key].qty = Math.max(0, cart[key].qty - 1);
  if (cart[key].qty === 0) delete cart[key];
  saveCart();
  renderCardCtrl(id);
  updateBar();
}

function renderCardCtrl(id) {
  const ctrl = document.getElementById('ctrl-' + id);
  const card = document.getElementById('card-' + id);
  if (!ctrl) return;

  const item     = findItem(id);
  const totalQty = Object.entries(cart)
    .filter(([k]) => k === String(id) || k.startsWith(id + ':'))
    .reduce((s, [, v]) => s + v.qty, 0);

  card.classList.toggle('in-cart', totalQty > 0);

  if (item.options) {
    ctrl.innerHTML = totalQty === 0
      ? `<button class="add-btn"
           onclick="event.stopPropagation(); openItemPopup(${id})">+</button>`
      : `<div class="qty-row">
           <button class="qty-btn plus"
             style="width:auto;padding:0 10px;border-radius:100px;font-size:12px;font-weight:600;"
             onclick="event.stopPropagation(); openItemPopup(${id})">
             ${totalQty} змінити
           </button>
         </div>`;
  } else {
    ctrl.innerHTML = totalQty === 0
      ? `<button class="add-btn"
           onclick="event.stopPropagation(); addSimple(${id})">+</button>`
      : `<div class="qty-row">
           <button class="qty-btn minus"
             onclick="event.stopPropagation(); removeSimple(${id})">−</button>
           <span class="qty-num">${totalQty}</span>
           <button class="qty-btn plus"
             onclick="event.stopPropagation(); addSimple(${id})">+</button>
         </div>`;
  }
}

// ---------------------------------------------------------------------------
// Bottom bar
// ---------------------------------------------------------------------------

function updateBar() {
  const vals  = Object.values(cart);
  const count = vals.reduce((s, i) => s + i.qty, 0);
  const total = vals.reduce((s, i) => s + i.qty * i.price, 0);

  document.getElementById('cart-pill').classList.toggle('has-items', count > 0);
  document.getElementById('pill-label').textContent = count > 0
    ? count + ' ' + plural(count, 'позиція', 'позиції', 'позицій')
    : 'Кошик порожній';

  document.getElementById('confirm-btn').disabled = count === 0;
  document.getElementById('confirm-sub').textContent =
    count > 0 ? 'Разом: ' + total + ' ₴' : '';
}

// ---------------------------------------------------------------------------
// Confirm & skip  →  send data then close the WebApp
// ---------------------------------------------------------------------------

function confirmOrder() {
  const vals = Object.values(cart).filter(i => i.qty > 0);
  if (!vals.length) return;

  tg.sendData(JSON.stringify({
    action: 'preorder',
    items:  vals.map(i => ({ name: i.name, option: i.option, qty: i.qty, price: i.price })),
    total:  vals.reduce((s, i) => s + i.qty * i.price, 0),
  }));

  localStorage.removeItem(STORAGE_KEY);
  tg.close();
}

function skip() {
  tg.sendData(JSON.stringify({ action: 'skip' }));
  tg.close();
}

// ---------------------------------------------------------------------------
// Overlay helpers
// ---------------------------------------------------------------------------

function openOverlay(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e, id) {
  if (e.target === document.getElementById(id)) closeOverlay(id);
}

function closeItemPopup() {
  closeOverlay('item-overlay');
  popupItemId         = null;
  popupSelectedOption = null;
}

function closeCartDrawer() {
  closeOverlay('cart-overlay');
}

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------

function cartKey(id, opt) {
  return opt ? `${id}:${opt.label}` : String(id);
}

function findItem(id) {
  for (const cat of MENU.categories) {
    for (const item of cat.items) {
      if (item.id === id) return item;
    }
  }
  return null;
}

function plural(n, one, few, many) {
  const m10  = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11)                                 return one;
  if ([2, 3, 4].includes(m10) && ![12, 13, 14].includes(m100)) return few;
  return many;
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

loadCart();
buildUI(MENU);
MENU.categories.forEach(cat => cat.items.forEach(item => renderCardCtrl(item.id)));
updateBar();
</script>
</body>
