<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Передзамовлення</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --border: #3a3a3c;
      --subtext: #aeaeb2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg); color: white;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: var(--subtext); margin-bottom: 32px; line-height: 1.5; }
    .btn-skip {
      width: 100%; max-width: 320px;
      padding: 15px; border-radius: 14px;
      border: 1px solid var(--border);
      background: transparent; color: var(--subtext);
      font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🍽️</div>
  <h1>Передзамовлення</h1>
  <p>Меню скоро буде доступне тут.<br>Наразі ви можете пропустити цей крок.</p>
  <button class="btn-skip" onclick="skip()">Пропустити</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function skip() {
      tg.sendData(JSON.stringify({ action: 'skip' }));
    }
  </script>
</body>
</html>
